<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Favorite Person 💗</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffd6e7, #fff5fa, #ffe3ec);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    overflow: hidden;
  }

  /* Main Card with Bigger Scale & Zoom */
  .card {
    background: rgba(255, 255, 255, 0.95);
    width: 360px;
    padding: 40px 30px;
    border-radius: 45px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(255, 105, 180, 0.35);
    z-index: 5;
    backdrop-filter: blur(5px);
    border: 4px solid #fff0f5;
    animation: floatCard 4s ease-in-out infinite;
    transform: scale(1.15); /* Zooms in the entire card */
  }

  @keyframes floatCard {
    0%, 100% { transform: scale(1.15) translateY(0px); }
    50% { transform: scale(1.15) translateY(-8px); }
  }

  h1 {
    color: #ff4f9a;
    font-size: 28px; /* Larger title */
    margin-top: 15px;
    margin-bottom: 12px;
    text-shadow: 1px 1px 2px rgba(255, 182, 193, 0.5);
  }

  p {
    color: #555;
    font-size: 19px; /* Larger, clearer text */
    line-height: 1.5;
    margin-bottom: 28px;
  }

  /* Cute Glowing Button (Enlarged) */
  button {
    background: linear-gradient(45deg, #ff6fae, #ff4f9a);
    border: none;
    color: white;
    padding: 16px 32px;
    border-radius: 35px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(255, 79, 154, 0.4);
    transition: all 0.3s ease;
  }

  button:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 22px rgba(255, 79, 154, 0.6);
  }

  button:active {
    transform: scale(0.95);
  }

  /* --- Bigger Cute Teddy Bear --- */
  .teddy {
    width: 140px;
    height: 130px;
    position: relative;
    margin: auto;
  }

  .head {
    width: 105px;
    height: 95px;
    background: #b87545;
    border-radius: 50%;
    position: absolute;
    left: 17px;
    top: 22px;
  }

  /* Outer Ears */
  .ear {
    width: 38px;
    height: 38px;
    background: #b87545;
    border-radius: 50%;
    position: absolute;
    top: 10px;
  }

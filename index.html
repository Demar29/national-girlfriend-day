<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Favorite Person 💗</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffd6e7, #fff5fa, #ffe3ec);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    overflow: hidden;
  }

  /* Main Card with Bigger Scale & Zoom */
  .card {
    background: rgba(255, 255, 255, 0.95);
    width: 360px;
    padding: 40px 30px;
    border-radius: 45px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(255, 105, 180, 0.35);
    z-index: 5;
    backdrop-filter: blur(5px);
    border: 4px solid #fff0f5;
    animation: floatCard 4s ease-in-out infinite;
    transform: scale(1.05)⁠
; /* Zooms in the entire card */
  }

  @keyframes floatCard {
    0%, 100% { transform: scale(1.15) translateY(0px); }
    50% { transform: scale(1.15) translateY(-8px); }
  }

  h1 {
    color: #ff4f9a;
    font-size: 28px; /* Larger title */
    margin-top: 15px;
    margin-bottom: 12px;
    text-shadow: 1px 1px 2px rgba(255, 182, 193, 0.5);
  }

  p {
    color: #555;
    font-size: 19px; /* Larger, clearer text */
    line-height: 1.5;
    margin-bottom: 28px;
  }

  /* Cute Glowing Button (Enlarged) */
  button {
    background: linear-gradient(45deg, #ff6fae, #ff4f9a);
    border: none;
    color: white;
    padding: 16px 32px;
    border-radius: 35px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(255, 79, 154, 0.4);
    transition: all 0.3s ease;
  }

  button:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 22px rgba(255, 79, 154, 0.6);
  }

  button:active {
    transform: scale(0.95);
  }

  /* --- Bigger Cute Teddy Bear --- */
  .teddy {
    width: 140px;
    height: 130px;
    position: relative;
    margin: auto;
  }

  .head {
    width: 105px;
    height: 95px;
    background: #b87545;
    border-radius: 50%;
    position: absolute;
    left: 17px;
    top: 22px;
  }

  /* Outer Ears */
  .ear {
    width: 38px;
    height: 38px;
    background: #b87545;
    border-radius: 50%;
    position: absolute;
    top: 10px;
  }
  .ear.left { left: 14px; }
  .ear.right { right: 14px; }

  /* Inner Pink Ears */
  .ear-inner {
    width: 22px;
    height: 22px;
    background: #ffb6c1;
    border-radius: 50%;
    position: absolute;
    top: 8px;
    left: 8px;
  }

  /* Eyes */
  .eye {
    width: 12px;
    height: 12px;
    background: #2c1d11;
    border-radius: 50%;
    position: absolute;
    top: 55px;
    z-index: 2;
  }
  .eye.eye1 { left: 44px; }
  .eye.eye2 { right: 44px; }

  /* Muzzle & Nose */
  .muzzle {
    width: 38px;
    height: 28px;
    background: #f5d6ba;
    border-radius: 50%;
    position: absolute;
    left: 51px;
    top: 62px;
    z-index: 1;
  }

  .nose {
    width: 14px;
    height: 10px;
    background: #2c1d11;
    border-radius: 50%;
    position: absolute;
    left: 12px;
    top: 5px;
  }

  /* Rosy Cheeks */
  .blush {
    width: 16px;
    height: 9px;
    background: rgba(255, 105, 180, 0.5);
    border-radius: 50%;
    position: absolute;
    top: 63px;
    z-index: 2;
  }
  .blush.left { left: 32px; }
  .blush.right { right: 32px; }

  /* --- Flying Pop-up Messages --- */
  .reason {
    position: absolute;
    left: -450px;
    background: rgba(255, 255, 255, 0.98);
    padding: 15px 28px;
    border-radius: 30px;
    color: #ff3385;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 10px 30px rgba(255, 105, 180, 0.35);
    border: 3px solid #ffe6f2;
    animation: fly 4.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    z-index: 10;
    white-space: nowrap;
  }

  @keyframes fly {
    0% { left: -450px; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { left: 110vw; opacity: 0; }
  }

  /* --- Floating Background Elements --- */
  .floating-item {
    position: absolute;
    animation: rise 7s linear infinite;
    bottom: -60px;
    user-select: none;
    pointer-events: none;
  }

  @keyframes rise {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0.8;
    }
    100% {
      transform: translateY(-125vh) rotate(360deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<div class="card">
  <div class="teddy">
    <div class="ear left"><div class="ear-inner"></div></div>
    <div class="ear right"><div class="ear-inner"></div></div>
    <div class="head"></div>
    <div class="eye eye1"></div>
    <div class="eye eye2"></div>
    <div class="blush left"></div>
    <div class="blush right"></div>
    <div class="muzzle">
      <div class="nose"></div>
    </div>
  </div>

  <h1>Happy National Girlfriend Day 💗</h1>
  <p>
    To my favorite person 🥹<br><br>
    You make my days brighter,<br>
    my smiles bigger,<br>
    and my heart happier 💕
  </p>

  <button onclick="showReason()">
    Click me 💗
  </button>
</div>

<div class="floating-item" style="left:10%; font-size: 34px; animation-delay:0s;">💗</div>
<div class="floating-item" style="left:25%; font-size: 28px; animation-delay:3s;">✨</div>
<div class="floating-item" style="left:40%; font-size: 36px; animation-delay:1.5s;">💕</div>
<div class="floating-item" style="left:65%; font-size: 30px; animation-delay:4s;">❤️</div>
<div class="floating-item" style="left:80%; font-size: 26px; animation-delay:2s;">✨</div>
<div class="floating-item" style="left:90%; font-size: 38px; animation-delay:0.5s;">💞</div>

<script>
  let reasons = [
    "You always know how to make me smile 💕",
    "I love how caring your heart is 🥹",
    "You make my days feel special ✨",
    "I love your personality 💗",
    "I love every moment we spend talking ❤️",
    "You make me happy just by being you 🧸",
    "I love your beautiful smile 😊"
  ];

  let number = 0;

  function showReason() {
    let message = document.createElement("div");
    message.className = "reason";
    message.innerHTML = "🌸 " + reasons[number] + " 🌸";
    
    let randomTop = Math.floor(Math.random() * 60) + 15;
    message.style.top = randomTop + "%";
    
    document.body.appendChild(message);
    
    number++;
    if (number >= reasons.length) {
      number = 0;
    }

    setTimeout(function() {
      message.remove();
    }, 4500);
  }
</script>

</body>
</html>
